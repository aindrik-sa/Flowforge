services:
  postgres:
    image: postgres:17
    container_name: flowforge_prod_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: flowforge_prod_redis
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: flowforge_prod_backend
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flowforge}
      - POSTGRES_USER=${POSTGRES_USER:-flowforge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowforge123}
      - REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    restart: always

  celery:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: flowforge_prod_celery
    command: celery -A config worker -l info
    volumes:
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flowforge}
      - POSTGRES_USER=${POSTGRES_USER:-flowforge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowforge123}
      - REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    restart: always

  nginx:
    image: nginx:1.25
    container_name: flowforge_prod_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
